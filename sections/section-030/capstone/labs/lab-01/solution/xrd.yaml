apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xdepots.platform.starfleet.example
spec:
  group: platform.starfleet.example
  names:
    kind: XDepot
    plural: xdepots
  claimNames:
    kind: Depot
    plural: depots
  connectionSecretKeys:
    - endpoint
  defaultCompositionRef:
    name: depot-kubernetes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 3
                  default: 1
            status:
              type: object
              properties:
                namespace:
                  type: string
