# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Claims, XRDs And Compositions (PLAYGROUND) - playground environment.
# A clean sandbox: Crossplane 2.4.3, provider-kubernetes v1.4.1 and
# function-patch-and-transform v0.11.2 on kind. No cloud account is needed:
# the external resources are Kubernetes objects. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-080-playground-030-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

# Starting state: Crossplane and both packages healthy, a ProviderConfig named local-cluster, the provider service account bound to cluster-admin, and the namespaces starfleet and starfleet-records. No XRD, Composition or claim exists.
bootstrap:
  init:
    - name: prepare
      description: "Install Crossplane 2.4.3, provider-kubernetes v1.4.1 and function-patch-and-transform v0.11.2"
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
