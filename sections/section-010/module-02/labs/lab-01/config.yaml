# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Convergence, Drift And Blocked Progress (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-080-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: `probe` is stuck in a rollout to an image tag that does not
# exist, `scout` is stuck on a CPU request that no node can satisfy. Both
# report Progressing=False (ProgressDeadlineExceeded).
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads, break probe and scout, and record the Deployment uids
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: probe-converged
      description: probe runs the working image and the Deployment has converged (Available, Progressing with NewReplicaSetAvailable)
      type: file
      source: validation/validate-probe-converged.sh
      hint: Read the Progressing condition and the pod events first. Set the container image back to mccutchen/go-httpbin:2.25.0 (or roll back). Then wait for observedGeneration to equal generation and for all replicas to be available.
    - name: scout-converged
      description: scout pods are scheduled and ready with a CPU request of at most 100m, and the Deployment has converged
      type: file
      source: validation/validate-scout-converged.sh
      hint: A pod that stays Pending with the reason Unschedulable cannot be placed on a node. Lower the CPU request in the pod template (or roll back) and wait for the new pod to become ready.
    - name: report-recorded
      description: The ConfigMap convergence-report holds the failure facts that were read before the fix
      type: file
      source: validation/validate-report.sh
      hint: Read the Progressing reason of probe, the bad image of the newest ReplicaSet of probe, and the PodScheduled reason of the new scout pod before you fix them. The ConfigMap needs exactly the keys named in the task.
    - name: deployments-not-recreated
      description: No Deployment was deleted and created again, and probe keeps progressDeadlineSeconds 60
      type: file
      source: validation/validate-not-recreated.sh
      hint: Fix the Deployments in place. A deleted and re-created Deployment has a new uid.
    - name: services-still-answer
      description: shuttle gets answers from the scout and probe Services
      type: file
      source: validation/validate-services-answer.sh
      hint: Wait until the new pods are ready. A Service only sends requests to ready pods.

teardown:
  keepCluster: false
