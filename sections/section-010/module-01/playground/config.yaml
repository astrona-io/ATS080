# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Controllers, Desired State And The Control Loop (PLAYGROUND) - playground environment.
# A clean sandbox: it starts, applies the Starfleet workloads, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-080-playground-010-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# What the learner starts with: healthy Deployments `scout` and `probe` (two
# replicas each) with Services, the client Deployment `shuttle` in `starfleet`
# and the client Deployment `drifter` in `outpost`.
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
