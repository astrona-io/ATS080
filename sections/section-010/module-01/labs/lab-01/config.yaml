# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Controllers, Desired State And The Control Loop (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-080-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: healthy Deployments scout and probe (two replicas each),
# the clients shuttle and drifter, and a baseline of Deployment uids in the
# namespace lab-support.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and record the Deployment uids
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: scout-scaled-and-observed
      description: scout has 4 available replicas, from the Deployment, and the controller observed the latest spec
      type: file
      source: validation/validate-scout-scaled.sh
      hint: Change spec.replicas of the Deployment (kubectl scale on the Deployment). Then wait until status.observedGeneration equals metadata.generation and four replicas are available.
    - name: owner-chain-recorded
      description: The ConfigMap owner-chain holds the values read from the live ownership chain
      type: file
      source: validation/validate-owner-chain.sh
      hint: Read each value from the cluster with kubectl jsonpath. The pod owner kind is in metadata.ownerReferences of a scout pod, and the ReplicaSet name is the owner name.
    - name: deployments-not-recreated
      description: No Deployment was deleted and created again, and probe still has two replicas
      type: file
      source: validation/validate-not-recreated.sh
      hint: Do not delete the Deployments. A new Deployment gets a new uid, and the grader compares the uid with the one recorded at the start.
    - name: services-still-answer
      description: shuttle still gets answers from the scout and probe Services
      type: file
      source: validation/validate-services-answer.sh
      hint: Check that the new pods are ready. A Service only sends requests to ready pods.

teardown:
  keepCluster: false
