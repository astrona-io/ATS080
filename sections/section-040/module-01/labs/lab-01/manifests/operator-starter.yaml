apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-operator-script
  namespace: beacon-system
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    # Starter reconcile loop for Beacon resources: creates the child ConfigMap only.
    set -u
    WATCH_NAMESPACE="${WATCH_NAMESPACE:-starfleet}"
    INTERVAL="${INTERVAL:-5}"
    
    log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }
    
    ensure_child() {
      local name="$1" message="$2" channel="$3"
      jq -n --arg ns "$WATCH_NAMESPACE" --arg name "$name" --arg message "$message" --arg channel "$channel" '{
        apiVersion: "v1",
        kind: "ConfigMap",
        metadata: {
          name: ("beacon-" + $name),
          namespace: $ns,
          labels: {"app.kubernetes.io/managed-by": "beacon-operator"}
        },
        data: {message: $message, channel: $channel}
      }' | kubectl apply -f - >/dev/null
    }
    
    reconcile() {
      local name="$1" json message channel
      json="$(kubectl -n "$WATCH_NAMESPACE" get beacon "$name" -o json 2>/dev/null)" || return 0
      message="$(jq -r '.spec.message' <<<"$json")"
      channel="$(jq -r '.spec.channel // "routine"' <<<"$json")"
      ensure_child "$name" "$message" "$channel" || log "error: cannot ensure child for $name"
    }
    
    log "beacon-operator starting, namespace=$WATCH_NAMESPACE interval=${INTERVAL}s"
    while true; do
      for name in $(kubectl -n "$WATCH_NAMESPACE" get beacons -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
        reconcile "$name"
      done
      sleep "$INTERVAL"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon-operator
  namespace: beacon-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-operator
  template:
    metadata:
      labels:
        app: beacon-operator
    spec:
      serviceAccountName: beacon-operator
      containers:
        - name: operator
          image: alpine/k8s:1.35.8
          command: ["bash", "/scripts/reconcile.sh"]
          env:
            - name: HOME
              value: /tmp
            - name: WATCH_NAMESPACE
              value: starfleet
            - name: INTERVAL
              value: "5"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: beacon-operator-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
