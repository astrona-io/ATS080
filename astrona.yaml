# Each module has a playground, a graded lab and each section ends with a capstone and a quiz. Labs and playgrounds are untested.
training:
  id: ATS080
  title: 'CNPA: Platform APIs and Provisioning Infrastructure'
  description: Concept lessons, playgrounds, graded labs, capstones and original scenario quizzes covering every published objective in this CNPA domain. Labs run on kind (Kubernetes 1.35).
  certification:
    name: Certified Cloud Native Platform Engineering Associate
    code: CNPA
    provider: CNCF / Linux Foundation
    domain: Platform APIs and Provisioning Infrastructure
    weight: 12
    competencies:
    - Kubernetes Reconciliation Loop
    - APIs for Self-Service Platforms (CRDs)
    - Infrastructure Provisioning with Kubernetes
    - Kubernetes Operator Pattern for Integration
modules:
  - id: module-intro
    title: Introduction
    description: Audience, reading method and review process.
    content:
    - type: reading
      title: Introduction
      path: sections/intro/README.md
    - type: reading
      title: Welcome To The Course
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: Get Your Machine Ready
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: How This Course Is Made
      path: sections/intro/course-03-how-this-course-is-made.md
  - id: module-010
    title: "Kubernetes Reconciliation Loop"
    description: >
      Makes the reader able to explain how Kubernetes controllers keep the
      cluster at its desired state: the observe, compare, act and report
      loop, spec and status, ownership from Deployment to Pod, watches and
      level-triggered logic, drift correction and rollouts, conditions and
      progress deadlines, events, finalizers and garbage collection, and
      how to unblock a Deployment that cannot converge.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md

      - type: reading
        title: "Controllers, Desired State And The Control Loop"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Spec, Status And The Control Loop"
        path: sections/section-010/module-01/course-01-spec-status-and-the-control-loop.md
      - type: reading
        title: "Ownership From Deployment To Pod"
        path: sections/section-010/module-01/course-02-ownership-from-deployment-to-pod.md
      - type: reading
        title: "Watches And Level-Triggered Reconciliation"
        path: sections/section-010/module-01/course-03-watches-and-level-triggered-reconciliation.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Scale A Deployment And Read The Ownership Chain Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: kubernetes-controllers
        task_kind: build
        tags: [reconciliation, deployment, replicaset, ownerreferences, observedgeneration, garbage-collection]
        learning_goals:
          - Scale a Deployment and let the controller create the missing pods
          - Follow the owner chain from a pod to its Deployment and record the uids and generation
          - Prove that the Deployment was changed in place and not created again
        resources:
          - name: "Kubernetes controllers"
            url: https://kubernetes.io/docs/concepts/architecture/controller/
          - name: "Owners and dependents"
            url: https://kubernetes.io/docs/concepts/overview/working-with-objects/owners-dependents/
      - type: reading
        title: "Summary"
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: "Convergence, Drift And Blocked Progress"
        path: sections/section-010/module-02/course.md
      - type: reading
        title: "Drift Correction And Rollouts"
        path: sections/section-010/module-02/course-01-drift-correction-and-rollouts.md
      - type: reading
        title: "Conditions And Progress Deadlines"
        path: sections/section-010/module-02/course-02-conditions-and-progress-deadlines.md
      - type: reading
        title: "Reading Blocked Progress"
        path: sections/section-010/module-02/course-03-reading-blocked-progress.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-02/labs/lab-01/question.md
      - type: lab
        title: "Fix Deployments That Cannot Converge Lab"
        path: sections/section-010/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: kubernetes-controllers
        task_kind: troubleshooting
        tags: [reconciliation, progressdeadlineseconds, conditions, events, imagepullbackoff, unschedulable]
        learning_goals:
          - Record why two Deployments report Progressing false from their conditions, pods and events
          - Fix a bad image and an impossible resource request in place
          - Prove convergence with generation, observedGeneration and the Available and Progressing conditions
        resources:
          - name: "Deployments"
            url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
          - name: "Debug pods"
            url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
      - type: reading
        title: "Finalizers And Garbage Collection"
        path: sections/section-010/module-02/course-04-finalizers-and-garbage-collection.md
      - type: reading
        title: "Summary"
        path: sections/section-010/module-02/course-05-summary.md

      - type: reading
        title: "Question"
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Reconciliation Loop Capstone Lab"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 40m
        topic: kubernetes-controllers
        task_kind: troubleshooting
        tags: [reconciliation, deployment, finalizer, ownerreferences, readiness-probe, imagepullbackoff, conditions]
        learning_goals:
          - Unblock a rollout with a bad image and a rollout with a failing readiness probe
          - Release a ConfigMap whose deletion is held by a finalizer
          - Create a dependent object with a live ownerReference and record the rollout revision
        resources:
          - name: "Deployments"
            url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
          - name: "Finalizers"
            url: https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/
          - name: "Garbage collection"
            url: https://kubernetes.io/docs/concepts/architecture/garbage-collection/
      - type: quiz
        title: "Knowledge Check: Kubernetes Reconciliation Loop"
        path: sections/section-010/quiz.yaml
        pass_score: 70
  - id: module-020
    title: "APIs for Self-Service Platforms (CRDs)"
    description: >
      Makes the reader able to design a self-service platform API as a
      CustomResourceDefinition: scope, structural schema with required
      fields, enumerations and defaults, CEL validation rules, printer
      columns and the status subresource, then served and stored versions,
      deprecation, status conditions as a contract, tenant RBAC on custom
      resources and the limits of ValidatingAdmissionPolicy, ending with one
      complete API that has no controller.
    status: alpha
    content:
      - type: reading
        title: "APIs for Self-Service Platforms (CRDs)"
        path: sections/section-020/README.md

      - type: reading
        title: "CRD Schemas And Validation"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "CRD Anatomy And Scope"
        path: sections/section-020/module-01/course-01-crd-anatomy-and-scope.md
      - type: reading
        title: "Schemas, Required Fields, Enumerations And Defaults"
        path: sections/section-020/module-01/course-02-schemas-required-enums-and-defaults.md
      - type: reading
        title: "CEL Validation Rules"
        path: sections/section-020/module-01/course-03-cel-validation-rules.md
      - type: reading
        title: "Printer Columns, Status And kubectl explain"
        path: sections/section-020/module-01/course-04-printer-columns-status-and-explain.md
      - type: reading
        title: "Question"
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "CRD Schemas And Validation Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 40m
        topic: platform-apis
        task_kind: build
        tags: [crd, openapi-schema, defaults, cel, status-subresource, printer-columns]
        learning_goals:
          - Replace an open CRD schema with required fields, enumerations, limits and defaults
          - Add CEL rules for a cross-field check and two transition rules
          - Enable the status subresource and add printer columns
        resources:
          - name: "Extend the Kubernetes API with CustomResourceDefinitions"
            url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/
          - name: "Validation rules for CRDs"
            url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/#validation-rules
      - type: reading
        title: "Summary"
        path: sections/section-020/module-01/course-05-summary.md

      - type: reading
        title: "Versions, Status Contracts And Tenant Access"
        path: sections/section-020/module-02/course.md
      - type: reading
        title: "Served And Stored Versions, Deprecation And Conversion"
        path: sections/section-020/module-02/course-01-versions-deprecation-and-conversion.md
      - type: reading
        title: "Status Conditions As A Contract"
        path: sections/section-020/module-02/course-02-status-conditions-as-a-contract.md
      - type: reading
        title: "Tenant RBAC, Admission Limits And Why A CRD Alone Does Nothing"
        path: sections/section-020/module-02/course-03-tenant-rbac-and-admission-limits.md
      - type: reading
        title: "Question"
        path: sections/section-020/module-02/labs/lab-01/question.md
      - type: lab
        title: "Versions, Status Condition And Tenant Access Lab"
        path: sections/section-020/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 35m
        topic: platform-apis
        task_kind: build
        tags: [crd, versions, deprecation, status-conditions, rbac, auth-can-i]
        learning_goals:
          - Make v1beta1 the only storage version and deprecate v1alpha1 with a warning
          - Grant least-privilege Roles and RoleBindings to an editor group and an auditor group
          - Write a Ready condition through the status subresource with the current observedGeneration
        resources:
          - name: "Versions in CustomResourceDefinitions"
            url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definition-versioning/
          - name: "Using RBAC Authorization"
            url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
      - type: reading
        title: "Summary"
        path: sections/section-020/module-02/course-04-summary.md

      - type: reading
        title: "Question"
        path: sections/section-020/capstone/labs/lab-01/question.md
      - type: lab
        title: "Capstone: A Complete Self-Service API"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 60m
        topic: platform-apis
        task_kind: build
        tags: [crd, schema, cel, status-subresource, rbac, validating-admission-policy]
        learning_goals:
          - Define the Environment CRD with schema, defaults, CEL rules, status subresource and printer columns
          - Give two tenant teams and an auditor group least-privilege access in their namespaces
          - Restrict production environments to labeled namespaces with a ValidatingAdmissionPolicy
        resources:
          - name: "Validating Admission Policy"
            url: https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
          - name: "Extend the Kubernetes API with CustomResourceDefinitions"
            url: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/

      - type: quiz
        title: "Knowledge Check: APIs for Self-Service Platforms (CRDs)"
        path: sections/section-020/quiz.yaml
        pass_score: 70
  - id: module-030
    title: "Infrastructure Provisioning with Kubernetes"
    description: >
      Makes the reader able to offer infrastructure as a Kubernetes API
      and to explain how a request becomes real resources: claims,
      composite resource definitions and Compositions with a function
      pipeline, providers with their ProviderConfig and identity,
      connection secrets, Synced and Ready conditions, partial failure,
      and what is kept or removed when a claim is deleted.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-030/README.md

      - type: reading
        title: "Claims, XRDs And Compositions"
        path: sections/section-030/module-01/course.md
