        path: sections/section-030/module-01/course-02-compositions-and-function-pipelines.md
      - type: reading
        title: "Following A Claim Through Reconciliation"
        path: sections/section-030/module-01/course-03-following-a-claim-through-reconciliation.md
      - type: reading
        title: "Question"
        path: sections/section-030/module-01/labs/lab-01/question.md
      - type: lab
        title: "Claims, XRDs And Compositions Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: crossplane
        task_kind: build
        tags: [crossplane, composition, xrd, claim, function-patch-and-transform, provider-kubernetes]
        learning_goals:
          - Write a Composition that creates a namespace and a Deployment from a claim
          - Patch the claim name and replica count into the composed Objects and set a readiness policy
          - Report the created namespace in the status of the claim
        resources:
          - name: "Crossplane compositions"
            url: https://docs.crossplane.io/latest/composition/compositions/
          - name: "Function patch and transform"
            url: https://github.com/crossplane-contrib/function-patch-and-transform
      - type: reading
        title: "Summary"
        path: sections/section-030/module-01/course-04-summary.md

      - type: reading
        title: "Providers, Identities, Connection Secrets And Deletion"
        path: sections/section-030/module-02/course.md
      - type: reading
        title: "Providers, ProviderConfigs And Identity"
        path: sections/section-030/module-02/course-01-providers-providerconfigs-and-identity.md
      - type: reading
        title: "Connection Secrets, Conditions And Partial Failure"
        path: sections/section-030/module-02/course-02-connection-secrets-conditions-and-partial-failure.md
      - type: reading
        title: "Management Policies And Deletion"
        path: sections/section-030/module-02/course-03-management-policies-and-deletion.md
      - type: reading
        title: "Question"
        path: sections/section-030/module-02/labs/lab-01/question.md
      - type: lab
        title: "Identity, Connection Secret And Deletion Lab"
        path: sections/section-030/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 35m
        topic: crossplane
        task_kind: build
        tags: [crossplane, provider-kubernetes, providerconfig, rbac, connection-secret, deletion-policy, orphan]
        learning_goals:
          - Grant the provider identity access to Deployments with a least-privilege ClusterRole
          - Publish a connection secret for a claim and read its value
          - Set an orphan deletion policy so the record survives a deleted claim
        resources:
          - name: "Crossplane providers"
            url: https://docs.crossplane.io/latest/packages/providers/
          - name: "Provider Kubernetes"
            url: https://github.com/crossplane-contrib/provider-kubernetes
      - type: reading
        title: "Summary"
        path: sections/section-030/module-02/course-04-summary.md

      - type: reading
        title: "Question"
        path: sections/section-030/capstone/labs/lab-01/question.md
