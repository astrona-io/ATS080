        path: sections/section-040/module-02/course-02-from-issuer-to-secret.md
      - type: reading
        title: "Question"
        path: sections/section-040/module-02/labs/lab-01/question.md
      - type: lab
        title: "Issue Certificates With cert-manager Lab"
        path: sections/section-040/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: operators
        task_kind: build
        tags: [cert-manager, issuer, certificate, secret, conditions, events]
        learning_goals:
          - Create a selfSigned Issuer and a Certificate that writes a TLS Secret with a set duration and renewal window
          - Read the Ready condition and events to find why a Certificate waits
          - Fix a waiting Certificate with a namespaced Issuer and no change to cert-manager
        resources:
          - name: "cert-manager documentation"
            url: https://cert-manager.io/docs/
          - name: "SelfSigned issuer"
            url: https://cert-manager.io/docs/configuration/selfsigned/
      - type: reading
        title: "Upgrades And Blast Radius"
        path: sections/section-040/module-02/course-03-upgrades-and-blast-radius.md
      - type: reading
        title: "Leader Election And When The Operator Is Down"
        path: sections/section-040/module-02/course-04-leader-election-and-operator-down.md
      - type: reading
        title: "Summary"
        path: sections/section-040/module-02/course-05-summary.md

      - type: reading
        title: "Question"
        path: sections/section-040/capstone/labs/lab-01/question.md
      - type: lab
        title: "Operator Integration Capstone"
        path: sections/section-040/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 45m
        topic: operators
        task_kind: troubleshooting
        tags: [cert-manager, clusterissuer, certificate, rbac, cluster-admin, leader-election, deployment]
        learning_goals:
          - Restore a stopped controller and confirm it holds its lease
          - Create the ClusterIssuer a Certificate needs and issue both DNS names
