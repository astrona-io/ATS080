        difficulty: advanced
        estimated_duration: 50m
        topic: crossplane
        task_kind: build
        tags: [crossplane, xrd, composition, claim, connection-secret, deletion-policy, schema-validation]
        learning_goals:
          - Write an XRD with claim names, a bounded schema and a connection secret key
          - Write a Composition with a namespace, a Deployment and an orphaned record
          - Create claims, read the connection secret and delete a claim while the record stays
        resources:
          - name: "Crossplane composite resource definitions"
            url: https://docs.crossplane.io/latest/composition/composite-resource-definitions/
          - name: "Crossplane claims"
            url: https://docs.crossplane.io/latest/composition/claims/
      - type: quiz
        title: "Knowledge Check: Infrastructure Provisioning with Kubernetes"
        path: sections/section-030/quiz.yaml
        pass_score: 70
  - id: module-040
    title: "Kubernetes Operator Pattern for Integration"
    description: >
      Makes the reader able to build and operate Kubernetes operators:
      a CRD plus a reconcile loop with least-privilege RBAC, idempotent
      actions, status, owner references and finalizers, and the install,
      certificate issuing, upgrade rules, blast radius and outage
      behavior of a real operator, cert-manager.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-040/README.md

      - type: reading
        title: "The Operator Pattern: CRD Plus Controller"
        path: sections/section-040/module-01/course.md
      - type: reading
        title: "A CRD Without A Controller"
        path: sections/section-040/module-01/course-01-crd-without-a-controller.md
      - type: reading
        title: "A Reconcile Loop In A Deployment"
        path: sections/section-040/module-01/course-02-reconcile-loop-in-a-deployment.md
      - type: reading
        title: "Finalizers And Owner References"
        path: sections/section-040/module-01/course-03-finalizers-and-owner-references.md
      - type: reading
        title: "Question"
        path: sections/section-040/module-01/labs/lab-01/question.md
      - type: lab
        title: "Build A Beacon Operator Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 40m
        topic: operators
        task_kind: build
        tags: [operator, crd, controller, reconcile, rbac, finalizer, ownerreferences]
        learning_goals:
          - Run a reconcile loop as a Deployment whose script lives in a ConfigMap
          - Create child objects with owner references and keep status in step with the spec
          - Clean up a registry entry in another namespace with a finalizer and grant only the permissions the controller needs
        resources:
          - name: "Operator pattern"
            url: https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
          - name: "Custom Resources"
            url: https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/
      - type: reading
        title: "Summary"
